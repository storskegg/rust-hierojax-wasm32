[workspace]
resolver = "3"
members = ["hieroxide-tables", "crates/hieroxide-core", "crates/hieroxide-outline", "crates/hieroxide", "crates/hieroxide-cli", "crates/hieroxide-wasm", "crates/hieroxide-wasm-outline"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/storskegg/rust-hierojax-wasm32"
publish = false

# The size-first knobs of the plan: speed first within the size budget (opt-level 3 is
# measured against "s" in the build notes). A panic aborts, so no unwinding tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The reference test lays out the whole corpus: seconds with this, minutes without.
[profile.test]
opt-level = 2
