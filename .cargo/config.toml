# Flags for the wasm builds only (the host build, `cargo test`, is as it was).
#
# inline-threshold: LLVM's default for -O3 is 250. At 25 the wasm is 3.8 KB smaller in brotli
# (compat, 85,722 -> 81,914 B) and the benchmark of tests/bench/run.mjs --real does not move beyond
# its noise (about 2%); see PORT_MAP.md for the measurements and for 0, 10, 75 and 150.
#
# These replace a RUSTFLAGS in the environment, so tools/build-compat.mjs and tools/build-consistent.mjs
# refuse to run with one set: a number from such a build would not be the shipped one.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "llvm-args=-inline-threshold=25"]
