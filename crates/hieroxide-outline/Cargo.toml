[package]
name = "hieroxide-outline"
version = "0.1.0"
description = "Outline raster backend of Hieroxide: glyph pixels from the font's outlines, the same on every platform"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]

[features]
# Glyphs shared by `Arc`, so that what holds them is `Send`.
sync = []

[dependencies]
hieroxide-core = { path = "../hieroxide-core" }
# Pure Rust: the same bits in wasm and natively, unlike a platform's libm.
libm = "0.2.16"

[dev-dependencies]
# Holds `font.rs` to a general parser, over the whole font.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

[[example]]
name = "fit"

[[example]]
name = "ink"
path = "../../tests/golden/ink.rs"

[[test]]
name = "golden"
path = "../../tests/golden/native.rs"

[[example]]
name = "fragments"
path = "../../tests/golden/fragments.rs"
