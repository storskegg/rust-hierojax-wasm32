[package]
name = "hieroxide-wasm-outline"
version = "0.1.0"
description = "WebAssembly build of Hieroxide with the outline raster: consistent mode, no canvas"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The drop-in's interface over outlines: upstream's layout and printer with this raster, for a
# browser whose canvas readback is corrupt, and for measuring the raster against upstream. Not in
# the build of the new API.
compat-api = []
# Path output (`svg: 'paths'` in the new API): the printer and the outlines it reads. A separate build,
# because they do not fit in the default build's size limit (`tools/size-check.mjs`).
paths = []
# The no-op profile hooks (`set_profile`, `timings`) that the compat shim's test build calls. Only for
# build/compat-outline, which keeps the shim's test switches; never in a shipped build.
test-levers = []

[dependencies]
hieroxide-core = { path = "../hieroxide-core" }
hieroxide-outline = { path = "../hieroxide-outline" }
# Pinned to the version of the wasm-bindgen CLI the build script runs (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.130"
