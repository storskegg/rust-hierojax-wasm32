[package]
name = "hieroxide-wasm"
version = "0.1.0"
description = "WebAssembly build of Hieroxide for browsers: the canvas raster backend and the drop-in entry points"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The profile hooks the benchmarks call (`set_profile`, `timings`) and the host import they time with. The
# shipped builds leave them out; `tools/build-compat.mjs --test-levers` turns this on.
test-levers = []

[dependencies]
# Without the printers of consistent mode: this build is the drop-in, and stays as it was.
hieroxide-core = { path = "../hieroxide-core", default-features = false }
# Pinned to the version of the wasm-bindgen CLI the build script runs (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.130"
