[package]
name = "hieroxide-wasm"
version = "0.1.0"
description = "WebAssembly build of Hieroxide for browsers: the canvas raster backend and the drop-in entry points"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hieroxide-core = { path = "../hieroxide-core" }
# Pinned to the version of the wasm-bindgen CLI the build script runs (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.129"
