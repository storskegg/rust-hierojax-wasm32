[package]
name = "hieroxide"
version = "0.1.0"
description = "Public API of Hieroxide: typeset Egyptian hieroglyphs from a font's outlines, as data or as SVG"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]

[features]
default = ["paths"]
# `Layout::to_svg(SvgKind::Paths)`. Without it that is an `Unsupported` error and the printer is not
# linked.
paths = []

[dependencies]
hieroxide-core = { path = "../hieroxide-core" }
hieroxide-outline = { path = "../hieroxide-outline", features = ["sync"] }

[dev-dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

[[test]]
name = "corpus"
path = "../../tests/api/corpus.rs"

[[test]]
name = "api"
path = "../../tests/api/api.rs"

[[test]]
name = "outlines"
path = "../../tests/api/outlines.rs"

[[example]]
name = "wall"
path = "../../tests/bench/wall.rs"
