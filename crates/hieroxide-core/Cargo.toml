[package]
name = "hieroxide-core"
version = "0.1.0"
description = "Parser and layout core of Hieroxide, a Rust port of hierojax"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]

# The differential test against the jison parser lives in tests/parser/ at the
# repository root.
[[example]]
name = "parser_dump"
path = "../../tests/parser/dump.rs"

[[example]]
name = "parser_bench"
path = "../../tests/parser/bench.rs"

[[test]]
name = "parser_fixtures"
path = "../../tests/parser/fixtures.rs"
