name: golden

# Consistent mode's reference files. The native test on each push and pull request; the browsers
# by hand. Any difference is a bug, on any OS: see tests/golden/README.md.
#
# Also here, because this is the workflow that runs on every push and pull request: the size gate
# (`size`, `node tools/size-check.mjs --build`, the tool that runs locally). It fails when a build is
# over its limit in tools/size-limits.json: consistent 100,000 B; compat at the ratchet of what it
# reached. The TARGET of compat is 75,000 B (it is under it now); the limit only stops it growing back.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run, comma separated
        required: false
        default: chromium,firefox,webkit

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (as rust-toolchain.toml)
        run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo test -p hieroxide-outline
      # The public API and the command line over the same corpus: tests/README.md.
      - run: cargo test -p hieroxide-api -p hieroxide-cli

  # Sizes are bytes of brotli -q 11 of the built files, and they depend on the compiler, wasm-bindgen,
  # wasm-opt and node's brotli: all four are pinned here, and tools/size-limits.json was set with the
  # same versions (on macOS). A bump of any of them is a change to look at the sizes of.
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_VERSION: 1.99.1
      WASM_BINDGEN_VERSION: 0.2.130
      BINARYEN_VERSION: version_133
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-bindgen
            target
          key: size-${{ runner.os }}-rust${{ env.RUST_VERSION }}-bindgen${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - name: wasm-bindgen CLI (the version of Cargo.lock)
        run: |
          locked=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          [ "$locked" = "$WASM_BINDGEN_VERSION" ] || { echo "Cargo.lock has wasm-bindgen $locked: update WASM_BINDGEN_VERSION"; exit 1; }
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version | cut -d' ' -f2)" != "$WASM_BINDGEN_VERSION" ]; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
      - name: wasm-opt (binaryen, pinned)
        run: |
          # The sha256 is the digest GitHub lists for this release asset (version_133, x86_64-linux).
          file="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$file"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/$file" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - run: wasm-opt --version | tee /dev/stderr | grep -q "${BINARYEN_VERSION#version_}"
      - run: npm ci
        working-directory: tools
      - run: node tools/size-check.mjs --build

  engines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENGINES: ${{ inputs.engines }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Rust toolchain (as rust-toolchain.toml)
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      # Without wasm-opt: the bytes must not depend on it either.
      - run: npm ci
        working-directory: tools
      - run: node tools/build-consistent.mjs --only consistent --opt none
      - run: npm ci
        working-directory: tests/parity
      - run: npx playwright install --with-deps ${ENGINES//,/ }
        working-directory: tests/parity
      - run: node tests/golden/engines.mjs --engines "$ENGINES" --report golden-linux.json
      - if: contains(inputs.engines, 'firefox')
        run: node tests/golden/engines.mjs --engines firefox --sizes 40 --prefs '{"privacy.resistFingerprinting":true}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-linux
          path: golden-linux.json
          retention-days: 7
