[package]
name = "hieroxide-tables"
version = "0.1.0"
description = "Unicode code point tables for Hieroxide, a Rust port of hierojax"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "hieroxide_tables"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
lazy_static = "1.5.1"
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.13.1"
regex_static = "0.1.1"
